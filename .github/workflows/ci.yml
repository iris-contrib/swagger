name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: Set up Go 1.x
      uses: actions/setup-go@v6
      with:
        go-version-file: './go.mod'
        check-latest: true
    - run: go version

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v -race ./...

    # A directory that starts with an underscore is not part of "./...",
    # so each example is vetted, built and tested from its own directory.
    - name: Examples
      run: |
        out="$(mktemp -d)"
        for dir in _examples/*/; do
          echo "::group::${dir}"
          (cd "${dir}" && go vet ./... && go build -o "${out}/" ./... && go test -race ./...)
          echo "::endgroup::"
        done
